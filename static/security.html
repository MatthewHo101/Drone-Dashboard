<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account · Lysim</title><link rel="icon" href="/logo.png"><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script defer src="/nav.js"></script><script defer src="/security.js"></script></head>
<body><aside class="sidebar">
    <a class="brand" href="/#overview" aria-label="Lysim overview">
      <img class="brand-mark" src="/logo.png" width="41" height="41" alt="">
      <span>Lysim</span>
    </a>
    <nav aria-label="Workspace"></nav>
    
  </aside>
<main><div class="topbar"><button id="sign-out" class="secondary">Sign out</button></div><div id="workspace">
<header class="intro"><div><h1>Account</h1><p id="identity-label"></p></div></header><p id="state"></p><p role="status" id="message"></p>
<form id="controls" class="form-grid" hidden>
<label class="wide">Your current password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
<section class="panel account-card"><div class="panel-head"><h2>Google Calendar</h2></div><div class="entries"><button type="button" id="google-account" class="secondary">Connect Google Calendar</button></div></section>
<section class="panel account-card" hidden id="approvals"><div class="panel-head"><h2>Registration requests</h2></div><div class="entries"><label>Pending request <select name="request_id"></select></label>
<button class="primary" value="approve">Approve request</button> <button class="secondary" value="reject">Reject request</button>
</div></section>
<label>Display name<input name="display" maxlength="80" autocomplete="nickname"></label><button class="secondary" value="profile">Save display name</button>
<section class="panel wide"><div class="panel-head"><h2>Authenticator</h2></div><div class="entries">
<button type="submit" class="secondary" value="start" id="start">Start setup</button>
<div hidden id="setup"><p>Enter this key in an authenticator app using a six-digit, time-based account named Lysim.</p><pre id="key"></pre>
<label>Authenticator code <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
<button class="primary" value="confirm">Confirm enrollment</button></div>
<button class="secondary" value="codes" id="codes" hidden>Replace recovery codes</button>
<div hidden id="recovery"><p>Save these one-time recovery codes in your password manager.</p><pre id="secrets"></pre><button type="button" class="secondary" id="dismiss">I saved the codes</button></div></div></section>
<button class="secondary" value="logout-all">Sign out all devices</button>
<section class="panel wide" hidden id="admin"><div class="panel-head"><h2>Administration</h2></div><div class="entries">

<label>User <select name="target"></select></label>
<button class="secondary" value="disable">Disable user</button> <button class="secondary" value="enable">Enable user</button>
<button class="secondary" value="grant">Grant administrator</button> <button class="secondary" value="demote">Remove administrator role</button>
<label>New password for selected user <input name="replacement" type="password" autocomplete="new-password" maxlength="128"></label>
<button class="secondary" value="reset">Reset password</button>
<button class="danger-action" value="delete">Permanently delete user</button>
<p><button class="secondary" value="require" id="require">Require 2FA for the workspace</button></p>
<details class="workspace-fold"><summary>Recent security activity</summary><ol id="events"></ol></details></div></section>
</form></div></main></body></html>
