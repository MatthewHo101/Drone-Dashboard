<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251f">
  <title>Fieldbench · Drone R&D</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Fieldbench overview">
      <span class="brand-mark" aria-hidden="true">⌘</span>
      <span>Fieldbench<small>DRONE R&amp;D</small></span>
    </a>
    <nav aria-label="Workspace">
      <a href="#overview"><span aria-hidden="true">◫</span>Overview</a>
      <a href="#builds"><span aria-hidden="true">◇</span>Builds</a>
      <a href="#tests"><span aria-hidden="true">⌁</span>Tests</a>
      <a href="#issues"><span aria-hidden="true">◎</span>Issues</a>
      <a href="#parts"><span aria-hidden="true">▤</span>Parts</a>
    </nav>
    <div id="identity" class="identity"></div>
  </aside>
  <main id="main" tabindex="-1">
    <div class="topbar"><span>Engineering workspace</span><span id="environment" class="environment"></span></div>
    <div id="workspace" aria-busy="true"><p>Loading your workspace…</p></div>
    <p id="announcement" class="announcement" role="status"></p>
  </main>
  <dialog id="record-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
</body>
</html>
