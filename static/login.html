<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Lysim</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card">
<div class="login-brand"><img class="brand-mark" src="/logo.png" width="41" height="41" alt="">Lysim</div>
<h1 id="heading">Sign in</h1><p id="hint">Access your drone development workspace.</p>
<form id="credentials"><label>Username<input name="name" autocomplete="username" required maxlength="40" autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
<label id="factor" hidden>Authenticator or recovery code<input name="code" autocomplete="one-time-code" maxlength="20"></label>
<fieldset id="first" hidden disabled><legend>Change your temporary password</legend>
<label>Server activation code<input name="activation" autocomplete="off" required></label>
<label>New password<input name="replacement" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<label>Confirm new password<input name="repeat" type="password" autocomplete="new-password" required></label></fieldset>
<button class="primary" id="sign-in">Sign in</button></form>
<form id="create" hidden><label>New username (8–40 characters)<input name="name" minlength="8" required maxlength="40" autocomplete="off"></label>
<label>Display name<input name="display" required maxlength="80" autocomplete="nickname"></label>
<label>New password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
<label>Confirm password<input name="confirmation" type="password" required autocomplete="new-password"></label><button class="primary" id="submit-create">Request access</button></form>
<p id="message" role="status"></p>
<div class="login-actions"><button class="secondary" id="add">Register</button></div>
</main></body></html>
